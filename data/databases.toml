# Registry of every database the calculator ships. The single place a database is added.
#
# scripts/sync_databases.py reads this file to copy each source into web/ (the shipped copy is
# never edited by hand), to generate the calculator's load buttons in web/index.html, and to
# fail loudly if a source is missing, a web copy has drifted, or a database file sits in web/
# without an entry here. scripts/build_library.py reads it for the library's "On the shelf".
#
# To add a database: put its source (or build script output) in data/<system>/ with a
# PROVENANCE.md, add an entry below, and run scripts/sync_databases.py (the session-start
# refresh runs it too).
#
# Format by physics: .dat for MQMQA slags and salts, .tdb for alloy solid solutions, .utdb only
# when one calculation needs an alloy and a melt together, .xtdb for third-generation data.
# Store one format per database; the calculator converts to the others on demand.
#
# Fields: file (name in web/), source (path under data/), format, and for a loadable database
# card ("load" for section 1, "xtdb" for the XTDB card), button (element id), label (button text)
# plus title, kind and blurb for the library. A .utdb lists the sources of its halves in parts.
# An entry with no card is shipped without a load button; its comment says what uses it.

[[database]]
file = "FeO-MgO-SiO2-combined.dat"
source = "data/feo-mgo-sio2/FeO-MgO-SiO2-combined.dat"
format = "dat"
card = "load"
button = "example"
label = "Load the open slag database"
title = "Open slag database"
kind = "slag"
blurb = "FeO-MgO-SiO2 melt with its solid phases, assessed from open literature with the MQMQA liquid."

[[database]]
file = "LiCl-KCl.dat"
source = "data/licl-kcl/LiCl-KCl.dat"
format = "dat"
card = "load"
button = "example-salt"
label = "Load the open salt database"
title = "Open salt database"
kind = "salt"
blurb = "LiCl-KCl molten salt, the electrolyte used in pyroprocessing and thermal batteries."

[[database]]
file = "AlZn.tdb"
source = "data/al-zn/AlZn.tdb"
format = "tdb"
card = "load"
button = "example-alloy"
label = "Load the open alloy TDB"
title = "Open alloy database"
kind = "alloy"
blurb = "Al-Zn alloy phases in Thermo-Calc .tdb form."

